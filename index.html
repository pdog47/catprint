<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f2f2f7"><title>Print</title><style>
:root{color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--fg:#111;--muted:#8e8e93;--line:#c6c6c8;--blue:#0a84ff;--seg:#e5e5ea;--segon:#fff}@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--fg:#f5f5f7;--muted:#8e8e93;--line:#38383a;--seg:#2c2c2e;--segon:#636366}}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}main{max-width:520px;margin:auto;padding:14px 16px 110px}h1{font-size:34px;margin:14px 2px 20px;display:flex;align-items:center;justify-content:space-between}.headright{display:flex;align-items:center;gap:12px}.gear{border:0;background:none;color:var(--fg);padding:7px}.gear svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}.pill{border:0;border-radius:20px;padding:7px 11px;background:#e5e5ea;color:#666;font-weight:600;font-size:13px}.pill.connected{background:#e4f7e9;color:#248a3d}@media(prefers-color-scheme:dark){.pill{background:#2c2c2e;color:#aaa}.pill.connected{background:#173b24;color:#55d66b}}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34c759;margin-right:5px}.card{background:var(--card);border-radius:14px;margin:12px 0;overflow:hidden}.row{min-height:48px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.label{font-size:16px}.section{font-size:21px;font-weight:700;margin:22px 2px 10px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.tile{min-height:88px;text-align:left;padding:14px;background:var(--card);border:0;border-radius:16px;color:var(--fg);font-weight:650;font-size:17px}.tile small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:4px}.tile.setup{grid-column:1/-1;text-align:center;color:var(--blue)}.small{color:var(--muted);font-size:13px;padding:0 4px}.seg{display:flex;background:var(--se </style></head><body><main><h1>Print <span class="headright"><button id="settingsOpen" class="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button><button id="status" class="pill">Connect</button></span></h1><div id="nobt" class="hide">Bluetooth unavailable. Open in Bluefy.</div><div class="section">Quick prints</div><div id="tiles" class="tiles"></div><div id="updated" class="small"></div><div class="section">Your own</div><div class="tiles"><button id="choose" class="choose tile">Photo<small>Choose or paste an image</small></button><button id="textTile" class="choose tile">Text<small>Type a note to print</small></button></div><input type="file" id="file" accept="image/*"><section id="txtPane" class="card hide"><textarea id="text" placeholder="Type something to print"></textarea><div class="row"><span class="label">Size</span><input class="range" type="range" id="size" min="16" max="120" value="40"></div><div class="row"><span class="label">Align</span><select id="align"><option>center</option><option>left</option></select></div></section><div id="preview" class="preview empty"><div class="paper"><canvas id="out" width="384" height="1"></canvas></div><div class="small" id="previewHint">Tap preview to see original</div><a id="keylink" class="keylink hide" href="#">Print answer key</a></div><section id="imageControls" class="card hide"><div class="row"><span class="label">Trim borders</span><input id="trim" class="switch" type="checkbox" checked></div><div class="row"><span class="label">Sideways when wide</span><input id="rotate" class="switch" type="checkbox" checked></div><div class="row"><span class="label">Comic page → one strip</span><input id="panels" class="switch" type="checkbox"></div><div class="row"><span class="label">Mode</span><div class="seg" id="modes"><button data-mode="hd" class="on">HD</button><button data-mode="photo">Photo</button><button data-mode="bold">Bold</button><button data-mode="comic">Comic</button></div></div><div class="row"><span class="label">Brightness</span><input class="range" type="range" id="bright" min="-80" max="80" value="0"></div></section></main><div class="sticky"><div id="msg"></div><div class="printrow"><div class="copies" aria-label="Copies"><button id="copiesMinus" aria-label="Fewer copies">−</button><span id="copiesN">1×</span><button id="copiesPlus" aria-label="More copies">+</button></div><button id="big" disabled><i class="fill"></i><span>Print</span></button></div></div><div id="backdrop" class="backdrop hide"></div><section id="sheet" class="sheet hide"><div class="sheethead"><span>Settings</span><button id="settingsDone">Done</button></div><div class="card"><div class="row"><span class="label">Darkness</span><input class="range" type="range" id="dark" min="40" max="255" value="93"></div></div><div class="card feed"><div class="row feedrow"><span class="label">Feed repo</span><input id="repo" placeholder="owner/repo" autocapitalize="off" autocomplete="off" spellcheck="false"></div><div class="row feedrow"><span class="label">GitHub token</span><span id="tokenSaved" class="saved hide">Saved &#10003; <button id="changeToken" class="linkbutton">Change</button></span><input id="token" type="password" autocomplete="off" placeholder="Paste token"></div></div><button id="testStrip" class="tile" style="width:100%;min-height:54px">HD test strip</button><button id="alignStrip" class="tile" style="width:100%;min-height:54px;margin-top:10px">HD alignment test</button></section>
<script>
// ---------- MXW01 protocol (ported from MXW01-catprinter print.py, MIT) ----------
const W = 384, WB = 48, MIN_BYTES = 90 * WB;
// full 128-bit strings: Bluefy on iPhone rejects 16-bit numeric UUIDs
const U = s => `0000${s}-0000-1000-8000-00805f9b34fb`;
const SVC = U('ae30'), SVC_ALT = U('af30'), CTRL = U('ae01'), NOTE = U('ae02'), DATA = U('ae03');
const A1 = 0xa1, A2 = 0xa2, A9 = 0xa9, AA = 0xaa, AD = 0xad;

function crc8(bytes) {          // CRC-8, poly 0x07, init 0, no reflect
  let c = 0;
  for (const b of bytes) { c ^= b; for (let i = 0; i < 8; i++) c = c & 0x80 ? ((c << 1) ^ 0x07) & 0xff : (c << 1) & 0xff; }
  return c;
}
function cmd(id, payload) {
  const p = Uint8Array.from(payload);
  return Uint8Array.from([0x22, 0x21, id, 0x00, p.length & 0xff, p.length >> 8, ...p, crc8(p), 0xff]);
}
// bits: Uint8Array w*h, 1 = black. Rotated 180 (printer feeds bottom first), LSB = leftmost pixel.
function pack(bits, h) {
  const buf = new Uint8Array(Math.max(h * WB, MIN_BYTES));
  for (let y = 0; y < h; y++) {
    const sy = h - 1 - y;
    for (let x = 0; x < W; x++) if (bits[sy * W + (W - 1 - x)]) buf[y * WB + (x >> 3)] |= 1 << (x & 7);
  }
  return buf;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
let dev, ctrl, data, waiters = {};

function onNote(e) {
  const v = e.target.value, d = new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
  if (d.length < 6 || d[0] !== 0x22 || d[1] !== 0x21) return;
  const len = d[4] | (d[5] << 8), payload = d.slice(6, 6 + len);
  const w = waiters[d[2]]; if (w) { delete waiters[d[2]]; w(payload); }
}
function waitFor(id, secs) {
  return new Promise((res, rej) => {
    const t = setTimeout(() => { delete waiters[id]; rej(new Error('printer didn\'t answer')); }, secs * 1000);
    waiters[id] = p => { clearTimeout(t); res(p); };
  });
}
// Bluefy exposes writeValueWithoutResponse but it can throw; fall back to writeValue once and stick with it
let noWwr = false;
async function send(c, bytes) {
  if (!noWwr && c.writeValueWithoutResponse) {
    try { return await c.writeValueWithoutResponse(bytes); } catch (e) { noWwr = true; }
  }
  return c.writeValue(bytes);
}

async function connect() {
  if (!dev) {
    dev = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SVC] }, { services: [SVC_ALT] }, { namePrefix: 'MX' }],
      optionalServices: [SVC, SVC_ALT],
    });
    dev.addEventListener('gattserverdisconnected', () => setStatus('disconnected'));
  }
  const gatt = await dev.gatt.connect();
  const svc = await gatt.getPrimaryService(SVC).catch(() => gatt.getPrimaryService(SVC_ALT));
  ctrl = await svc.getCharacteristic(CTRL);
  data = await svc.getCharacteristic(DATA);
  const note = await svc.getCharacteristic(NOTE);
  await note.startNotifications();
  note.addEventListener('characteristicvaluechanged', onNote);
  const st = await getStatus();
  setStatus(`connected${st.battery != null ? ' · ' + st.battery + '%' : ''}`);
  return st;
}
async function getStatus() {
  const p = waitFor(A1, 7);
  await send(ctrl, cmd(A1, [0]));
  const s = await p;
  // print.py logs a short status and prints anyway, so don't abort on it
  const err = s.length >= 13 && s[12] !== 0 ? ({ 1: 'out of paper', 9: 'out of paper', 4: 'too hot, give it a minute', 8: 'battery low' }[s[13]] || 'error ' + s[13]) : null;
  return { battery: s.length > 9 ? s[9] : null, err };
}
async function printBits(bits, h, darkness, progress) {
  if (!dev || !dev.gatt.connected) await connect();
  await send(ctrl, cmd(A2, [darkness]));
  await sleep(100);
  const st = await getStatus();
  if (st.err) throw new Error(st.err);
  const buf = pack(bits, h), lines = buf.length / WB;
  const ok = waitFor(A9, 7);
  await send(ctrl, cmd(A9, [lines & 0xff, lines >> 8, 0x30, 0x00]));
  const r = await ok;
  if (r[0] !== 0) throw new Error('printer said no (A9 ' + r[0] + ')');
  for (let i = 0; i < buf.length; i += WB) {
    await send(data, buf.slice(i, i + WB));
    await sleep(15);
    if (i % (WB * 20) === 0) progress(i / buf.length);
  }
  const done = waitFor(AA, 15 + lines / 15);
  await send(ctrl, cmd(AD, [0]));
  progress(1);
  await sleep(100);
  await done.catch(() => {});      // some units never send AA; the print still finishes
}
// ===== HD (4-bit grayscale) printing for MXW01 =====
// Mode 0x02 on the A9 print request, 4 bits per pixel, 192 bytes per row, 0 = white, 15 = black,
// even (left) pixel in the HIGH nibble. Matches MaikelChan/CatPrinterBLE (MIT) and igna503/bleh.
// Same 180-degree flip as the 1-bit path, since print.py feeds bottom-first.
const WB4 = W / 2, MIN_LINES = 90;

// levels: Uint8Array W*h of 0..15 (15 = black)
function pack4(levels, h) {
  const buf = new Uint8Array(Math.max(h, MIN_LINES) * WB4);
  for (let y = 0; y < h; y++) {
    const sy = h - 1 - y;
    for (let x = 0; x < W; x++) {
      const v = levels[sy * W + (W - 1 - x)] & 15;
      buf[y * WB4 + (x >> 1)] |= v << (((x & 1) ^ 1) << 2);
    }
  }
  return buf;
}

// gray: Float32Array W*h, 0..255 (255 = white). Returns 0..15 levels with error diffusion so
// 16 shades blend smoothly instead of banding. gamma > 1 lightens mids to offset thermal dot gain.
function toLevels(gray, h, gamma = 1.0) {
  const g = Float32Array.from(gray, v => 15 * (1 - Math.pow(Math.max(0, Math.min(255, v)) / 255, 1 / gamma)));
  const out = new Uint8Array(W * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, o = g[i], n = Math.max(0, Math.min(15, Math.round(o))), e = o - n;
    out[i] = n;
    if (x + 1 < W) g[i + 1] += e * 7 / 16;
    if (y + 1 < h) { if (x) g[i + W - 1] += e * 3 / 16; g[i + W] += e * 5 / 16; if (x + 1 < W) g[i + W + 1] += e / 16; }
  }
  return out;
}

// Same flow as printBits, but 4bpp. Chunks stay 48 bytes (the size already proven on iPhone/Bluefy);
// the printer treats data as a stream, bleh even sends 20-byte pieces.
async function printLevels(levels, h, darkness, progress) {
  if (!dev || !dev.gatt.connected) await connect();
  await send(ctrl, cmd(A2, [darkness]));
  await sleep(100);
  const st = await getStatus();
  if (st.err) throw new Error(st.err);
  const buf = pack4(levels, h), lines = buf.length / WB4;
  const ok = waitFor(A9, 7);
  await send(ctrl, cmd(A9, [lines & 0xff, lines >> 8, 0x30, 0x02]));
  const r = await ok;
  if (r[0] !== 0) throw new Error('printer said no to HD (A9 ' + r[0] + ')');
  await sleep(400);  // let the printer settle after the A9 OK before any data
  // HD pacing, measured from the PC 2026-11-13 (AE03 is write-without-response only):
  // the head prints ~13-14 lines/s while data streams in. Too slow and it gives up (48B/15ms cut off at half);
  // too fast and its buffer overflows (it sends AE notifications) and the job aborts (full speed, 750 lines: a third).
  // Staying at most ~150 lines ahead of a 14 lines/s head printed 750 lines completely.
  // On AE: pause 300 ms and tighten to 60 lines ahead. 180 B writes (iOS max is ~182); if rejected, 96 B.
  // iPhone: Bluefy gives no backpressure, so a fast burst makes iOS silently DROP writes (first phone HD print came out
  // shifted sideways = bytes lost at the start). So never burst: one write per GAP ms (~21 lines/s, a bit faster than
  // the head) and cap the lead at 100 lines; the lead builds up gradually over the first ~15 s.
  const RATE = 14, GAP = 45, t0 = Date.now();
  let size = 180, ahead = 100, pauseUntil = 0, aeCount = 0, lastWrite = 0;
  const aeAt = [];
  let sentNow = 0;
  const watchAE = () => { waiters[0xae] = () => { aeCount++; if (aeAt.length < 5) aeAt.push(sentNow); ahead = 60; pauseUntil = Date.now() + 300; watchAE(); }; };
  watchAE();
  const label = (s, p) => { progress(s); const el = document.querySelector('#big span'); if (el) el.textContent = `Sending ${Math.round(s * 100)}% · Printing ${Math.round(Math.min(p, 1) * 100)}%`; };
  try {
    for (let i = 0, n = 0; i < buf.length;) {
      const el = (Date.now() - t0) / 1000;
      if (Date.now() < pauseUntil || Date.now() - lastWrite < GAP || (i + size) / WB4 > ahead + RATE * el) { await sleep(5); continue; }
      lastWrite = Date.now();
      try { await data.writeValueWithoutResponse(buf.slice(i, i + size)); }
      catch (e) { if (size > 96) { size = 96; continue; } throw e; }
      i += size; sentNow = i;
      if (++n % 20 === 0) label(i / buf.length, RATE * el / lines);
    }
    const secs = (Date.now() - t0) / 1000;
    hdLastSend = `HD sent ${Math.round(buf.length / 1024)} KB in ${secs.toFixed(1)} s (${size} B writes, ${aeCount} AE${aeAt.length ? ' at byte ' + aeAt.join(',') : ''})`;
    const done = waitFor(AA, 30 + lines / 4);
    await send(ctrl, cmd(AD, [0]));
    const tick = setInterval(() => label(1, RATE * (Date.now() - t0) / 1000 / lines), 500);
    await sleep(100);
    await done.catch(() => {});
    clearInterval(tick);
    progress(1);
  } finally { delete waiters[0xae]; }
}
let hdLastSend = '';

// Alignment strip: black bars on both edges, a diagonal and line numbers over a gradient.
// If any bytes get lost, the bars and the diagonal jump sideways from that line on.
function hdAlignStrip() {
  const h = 500, c = Object.assign(document.createElement('canvas'), { width: W, height: h }), x = c.getContext('2d');
  const g = x.createLinearGradient(48, 0, W, 0); g.addColorStop(0, '#fff'); g.addColorStop(1, '#000');
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, h); x.fillStyle = g; x.fillRect(48, 0, W - 48, h);
  x.fillStyle = '#000'; x.fillRect(0, 0, 5, h); x.fillRect(W - 5, 0, 5, h);
  x.font = 'bold 16px -apple-system, system-ui, sans-serif'; x.textBaseline = 'top';
  for (let y = 0; y < h; y += 50) { x.fillRect(5, y, 40, 2); x.fillText(String(y), 9, y + 4); }
  x.lineWidth = 3; x.strokeStyle = '#000'; x.beginPath(); x.moveTo(52, 0); x.lineTo(W - 8, h); x.stroke();
  const d = x.getImageData(0, 0, W, h).data, gray = new Float32Array(W * h);
  for (let i = 0; i < gray.length; i++) gray[i] = d[i * 4];
  return [toLevels(gray, h), h];
}

// Calibration strip: 16 labeled bands, 0 (white) to 15 (black). Print it, photo it, and we tune gamma.
function hdTestStrip() {
  const band = 24, h = band * 16, lv = new Uint8Array(W * h);
  const c = Object.assign(document.createElement('canvas'), { width: W, height: h }), x = c.getContext('2d');
  x.font = 'bold 18px -apple-system, system-ui, sans-serif'; x.textBaseline = 'middle';
  for (let k = 0; k < 16; k++) { x.fillStyle = '#fff'; x.fillRect(0, k * band, 48, band); x.fillStyle = '#000'; x.fillText(String(k), 8, k * band + band / 2); }
  const d = x.getImageData(0, 0, W, h).data;
  for (let y = 0; y < h; y++) for (let xx = 0; xx < W; xx++) lv[y * W + xx] = xx < 48 ? (d[(y * W + xx) * 4] < 128 ? 15 : 0) : Math.floor(y / band);
  return [lv, h];
}

// HD photo: gentle auto-tone (keeps real shadows), light sharpen, then 16 levels.
// Reuses autoTone/sharpen from the 1-bit pipeline.
function hdPhoto(g, h, bright = 0, gamma = 1.0) {
  autoTone(g, 0.35);
  if (bright) for (let i = 0; i < g.length; i++) g[i] = Math.max(0, Math.min(255, g[i] + bright));
  sharpen(g, W, h, 1, 0.7);
  return toLevels(g, h, gamma);
}
// For the preview canvas: level 0..15 -> gray pixel
const levelToGray = v => 255 - v * 17;
// ---------- image -> print jobs ----------
const $=id=>document.getElementById(id),out=$('out'),octx=out.getContext('2d');
// ---- image pipeline: gray Float32Array (0..255), W x h ----
function cropBox(c) { // trim flat borders (letterbox bars, white margins) like thermal_convert crop_tight
  const { width: w, height: h } = c, d = c.getContext('2d').getImageData(0, 0, w, h).data;

function deepLink(){if(deepDone||!manifest)return;let c;try{c=(new URLSearchParams(location.search).get('print')||'').toLowerCase()}catch(e){return}if(!c)return;deepDone=true;c=ALIAS[c]||c;const all=(manifest.categories||{})[c];const items=Array.isArray(all)?all.filter(x=>!/\-key\.png$/i.test(fileName(x))):[];if(!items.length){say('Nothing in the feed for "'+c+'"');return}const item=c==='report'?items[0]:items[Math.floor(Math.random()*items.length)];loadQuickItem(item,c,matchingKey(item,c))}
function openSettings(){$('backdrop').classList.remove('hide');$('sheet').classList.remove('hide')};function closeSettings(){$('backdrop').classList.add('hide');$('sheet').classList.add('hide')}
function setMode(){document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x.dataset.mode===mode))}
function saveFeed(){try{localStorage.setItem('feedRepo',$('repo').value);if($('token').value){localStorage.setItem('feedToken',$('token').value);savedToken=$('token').value;$('token').value='';$('token').classList.add('hide');$('tokenSaved').classList.remove('hide')}}catch(e){}loadManifest()}
if(!navigator.bluetooth){$('nobt').classList.remove('hide');$('status').disabled=true}
$('status').onclick=async()=>{try{if(dev&&dev.gatt.connected){await battery();say(lastRaw);return}const st=await connect();await battery();say(st.err||'Ready')}catch(e){say(e.name==='NotFoundError'?'':'Connect failed: '+e.message)}};$('choose').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{src=im;srcGray=null;active='photo';showOriginal=false;redraw();URL.revokeObjectURL(im.src)};im.onerror=()=>say('Could not read that image');im.src=URL.createObjectURL(f)};$('textTile').onclick=()=>{active='text';redraw();$('txtPane').classList.remove('hide');$('text').focus()};
for(const id of ['trim','rotate','panels','bright','text','size','align'])$(id).addEventListener('input',redraw);for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{mode=b.dataset.mode;setMode();redraw()};
$('settingsOpen').onclick=openSettings;$('settingsDone').onclick=closeSettings;$('backdrop').onclick=closeSettings;$('changeToken').onclick=()=>{$('tokenSaved').classList.add('hide');$('token').classList.remove('hide');$('token').value='';$('token').focus()};$('repo').value=(feedSettings()).repo;const saved=feedSettings();savedToken=saved.token;if(savedToken){$('tokenSaved').classList.remove('hide');$('token').classList.add('hide')}else $('token').classList.remove('hide');$('repo').addEventListener('change',saveFeed);$('token').addEventListener('change',saveFeed);loadManifest();
$('preview').onclick=e=>{if(e.target.closest('#keylink'))return;if(!job||!src)return;showOriginal=!showOriginal;if(showOriginal){out.width=src.width;out.height=src.height;out.getContext('2d').drawImage(src,0,0);out.style.imageRendering='auto'}else drawJob()};$('keylink').onclick=e=>{e.preventDefault();if(quickKey)loadQuickItem(quickKey,quickCategory,null)};
async function runPrint(j){const button=$('big');button.disabled=true;button.querySelector('span').textContent='Printing\u2026 0%';try{const n=copies;for(let k=1;k<=n;k++){copyNow=n>1?` ${k}/${n}`:'';await(j.kind==='levels'?printLevels(j.levels,j.h,+$('dark').value,p=>printProgress(p)):printBits(j.bits,j.h,+$('dark').value,p=>printProgress(p)));if(k<n)await sleep(1500)}copyNow='';say(n>1?`Done \u00b7 ${n} copies`:'Done');try{await battery()}catch(e){}}catch(e){say('Print failed: '+e.message)}button.querySelector('.fill').style.width='0';button.disabled=!job;button.querySelector('span').textContent=job?`Print \u00b7 ${Math.round(job.h/8)}mm`:'Print'}let copies=1,copyNow='';function setCopies(n){copies=Math.max(1,Math.min(9,n));$('copiesN').textContent=copies+'\u00d7'}
function printProgress(p){const b=$('big');b.querySelector('span').textContent=`Printing${copyNow}\u2026 ${Math.round(p*100)}%`;b.querySelector('.fill').style.width=(p*100)+'%'}
$('big').onclick=()=>{if(job)runPrint(job)};$('copiesMinus').onclick=()=>setCopies(copies-1);$('copiesPlus').onclick=()=>setCopies(copies+1);$('testStrip').onclick=()=>{const [levels,h]=hdTestStrip();runPrint({kind:'levels',levels,h})};$('alignStrip').onclick=()=>{const [levels,h]=hdAlignStrip();runPrint({kind:'levels',levels,h})};
function pasteImage(e){const f=[...e.clipboardData.files].find(x=>x.type.startsWith('image/'));if(!f)return;const im=new Image();im.onload=()=>{src=im;srcGray=null;active='photo';redraw()};im.src=URL.createObjectURL(f)}$('preview').addEventListener('paste',pasteImage);document.addEventListener('paste',pasteImage);redraw();
</script></body></html>
